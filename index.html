<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <title>Mais informações</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="top-progress" aria-hidden="true">
        <span class="top-progress__bar" id="progressBar"></span>
      </div>

      <header class="brand" aria-label="Marca">
        <span class="brand__mark">D</span>
        <span class="brand__name">DON</span>
      </header>

      <section class="form-stage" id="formStage" aria-live="polite">
        <div class="step-counter" id="stepCounter">1 → 2</div>
        <div class="question-card is-active" id="questionCard">
          <p class="eyebrow" id="eyebrow">Vamos começar</p>
          <h1 id="questionTitle">Qual o seu nome e sobrenome?</h1>
          <p class="question-help" id="questionHelp">Digite seu nome completo para continuarmos.</p>

          <form id="stepForm" novalidate>
            <label class="sr-only" id="fieldLabel" for="answerInput">Nome e sobrenome</label>
            <input
              id="answerInput"
              name="answer"
              type="text"
              autocomplete="name"
              placeholder="Digite sua resposta aqui..."
              spellcheck="false"
              required
            />
            <p class="error-message" id="errorMessage" role="alert"></p>

            <ul class="options" id="optionsList" role="listbox" aria-labelledby="questionTitle" hidden></ul>

            <div class="actions">
              <button class="primary-button" id="continueButton" type="submit">
                <span id="buttonText">OK</span>
                <span class="button-arrow" aria-hidden="true">↵</span>
              </button>
              <span class="hint">Pressione Enter ↵</span>
            </div>
          </form>
        </div>
      </section>

      <footer class="footer-note">
        <span>●</span>
        <span>Preenchimento rápido e seguro</span>
      </footer>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
