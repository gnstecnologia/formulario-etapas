<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <title>Mais informações</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="top-progress" aria-hidden="true">
        <span class="top-progress__bar" id="progressBar"></span>
      </div>

      <header class="brand" aria-label="Marca">
        <img class="brand__logo" src="./logo-genesis.png" alt="Genesis Company" />
      </header>

      <section class="form-stage" id="formStage" aria-live="polite">
        <div class="step-counter" id="stepCounter">1 → 2</div>
        <div class="question-card is-active" id="questionCard">
          <p class="eyebrow" id="eyebrow">Vamos começar</p>
          <h1 id="questionTitle">Qual o seu nome e sobrenome?</h1>

          <form id="stepForm" novalidate>
            <label class="sr-only" id="fieldLabel" for="answerInput">Nome e sobrenome</label>
            <input
              id="answerInput"
              name="answer"
              type="text"
              autocomplete="name"
              placeholder="Digite sua resposta aqui..."
              spellcheck="false"
              required
            />
            <p class="error-message" id="errorMessage" role="alert"></p>

            <ul class="options" id="optionsList" role="listbox" aria-labelledby="questionTitle" hidden></ul>

            <div class="actions">
              <button class="back-button" id="backButton" type="button" aria-label="Pergunta anterior">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M19 12H5" />
                  <path d="m12 19-7-7 7-7" />
                </svg>
              </button>
              <button class="primary-button" id="continueButton" type="submit">
                <span id="buttonText">OK</span>
                <span class="button-arrow" aria-hidden="true">↵</span>
              </button>
              <span class="hint">Pressione Enter ↵</span>
            </div>
          </form>
        </div>
      </section>

      <div class="stepper" role="group" aria-label="Navegação entre perguntas">
        <button class="stepper__btn" id="stepperPrev" type="button" aria-label="Pergunta anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m18 15-6-6-6 6" />
          </svg>
        </button>
        <button class="stepper__btn" id="stepperNext" type="button" aria-label="Próxima pergunta">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
